<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eritrea Elevation Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #8b4513 0%, #d4a574 50%, #f5deb3 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 1000px;
            width: 100%;
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            color: #8b4513;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .score-info {
            display: flex;
            justify-content: space-around;
            background: #f0f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .score-item {
            text-align: center;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #8b4513;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #4caf50;
            transition: width 0.3s;
        }

        .game-section {
            display: none;
        }

        .game-section.active {
            display: block;
        }

        .zones-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .zone {
            background: linear-gradient(135deg, #e8f5e9 0%, #f1f8f6 100%);
            border: 3px solid #8b4513;
            border-radius: 12px;
            padding: 20px;
            min-height: 280px;
            position: relative;
        }

        .zone.sea-level {
            background: linear-gradient(135deg, #e0f2f1 0%, #b2dfdb 100%);
            border-color: #00897b;
        }

        .zone.mid-altitude {
            background: linear-gradient(135deg, #fff3e0 0%, #ffe0b2 100%);
            border-color: #f57c00;
        }

        .zone.high-altitude {
            background: linear-gradient(135deg, #f3e5f5 0%, #e1bee7 100%);
            border-color: #7b1fa2;
        }

        .zone-label {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #333;
        }

        .zone-elevation {
            font-size: 12px;
            color: #666;
            margin-bottom: 15px;
            font-style: italic;
        }

        .zone-drop-area {
            min-height: 200px;
            background: rgba(255, 255, 255, 0.7);
            border: 2px dashed #999;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
        }

        .zone-drop-area.dragover {
            background: rgba(76, 175, 80, 0.2);
            border-color: #4caf50;
        }

        .animals-pool {
            background: #f9f9f9;
            border: 2px solid #ddd;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .animals-pool-title {
            font-size: 14px;
            font-weight: bold;
            color: #666;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .animals-available {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .animal {
            background: white;
            border: 2px solid #8b4513;
            border-radius: 8px;
            padding: 10px 15px;
            cursor: grab;
            font-size: 24px;
            user-select: none;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .animal:hover {
            background: #fff9e6;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .animal.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .animal-label {
            font-size: 12px;
            color: #333;
            font-weight: bold;
        }

        .zone .animal {
            border-color: #8b4513;
        }

        .zone.sea-level .animal {
            border-color: #00897b;
        }

        .zone.mid-altitude .animal {
            border-color: #f57c00;
        }

        .zone.high-altitude .animal {
            border-color: #7b1fa2;
        }

        .zone .animal {
            background: white;
            padding: 8px 12px;
            font-size: 20px;
        }

        .zone .animal .animal-label {
            display: none;
        }

        .buttons-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }

        .btn {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .btn-submit {
            background: #8b4513;
            color: white;
        }

        .btn-submit:hover {
            background: #6b3410;
            transform: translateY(-2px);
        }

        .btn-reset {
            background: #ddd;
            color: #333;
        }

        .btn-reset:hover {
            background: #ccc;
        }

        .feedback {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #c8e6c9;
            color: #2e7d32;
            border: 2px solid #4caf50;
        }

        .feedback.incorrect {
            background: #ffcdd2;
            color: #c62828;
            border: 2px solid #f44336;
        }

        .summary-section {
            text-align: center;
        }

        .summary-section h2 {
            font-size: 24px;
            color: #8b4513;
            margin-bottom: 15px;
        }

        .summary-section p {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .restart-btn {
            background: #8b4513;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .restart-btn:hover {
            background: #6b3410;
        }

        .fun-fact {
            background: #fff9e6;
            border-left: 4px solid #ff9800;
            padding: 15px;
            margin-top: 20px;
            border-radius: 4px;
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .stats {
            margin-top: 20px;
            padding: 15px;
            background: #f0f4f8;
            border-radius: 8px;
            font-size: 14px;
        }

        .stat-line {
            margin-bottom: 8px;
        }

        .stat-label {
            font-weight: bold;
            color: #333;
        }

        .stat-value {
            color: #8b4513;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🏔️ Eritrea Elevation Zones 🌊</h1>
            <p class="subtitle">Match animals to their elevation zones</p>
        </header>

        <div class="score-info">
            <div class="score-item">
                <div>Score</div>
                <div class="score-value" id="scoreDisplay">0</div>
            </div>
            <div class="score-item">
                <div>Correct</div>
                <div class="score-value" id="correctDisplay">0 / 9</div>
            </div>
            <div class="score-item">
                <div>Status</div>
                <div class="score-value" id="statusDisplay">🎮</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>

        <!-- Game Section -->
        <div class="game-section active" id="gameSection">
            <div class="animals-pool">
                <div class="animals-pool-title">🐾 Drag animals to their zones →</div>
                <div class="animals-available" id="animalsPool"></div>
            </div>

            <div class="zones-container" id="zonesContainer"></div>

            <div class="buttons-group">
                <button class="btn btn-submit" onclick="checkAnswers()">Check My Answers</button>
                <button class="btn btn-reset" onclick="resetGame()">Reset</button>
            </div>

            <div class="feedback" id="feedback"></div>
        </div>

        <!-- Summary Section -->
        <div class="game-section" id="summarySection">
            <div class="summary-section">
                <h2>Great Job! 🎉</h2>
                <p id="summaryText"></p>
                <button class="restart-btn" onclick="location.reload()">Play Again</button>
                <div class="fun-fact" id="funFact"></div>
            </div>
        </div>
    </div>

    <script>
        const gameData = {
            animals: [
                // Sea level
                { name: 'Coral Fish', emoji: '🐠', zone: 'sea-level', description: 'Vibrant reef dwellers' },
                { name: 'Sea Turtle', emoji: '🐢', zone: 'sea-level', description: 'Ocean voyagers' },
                { name: 'Dolphin', emoji: '🐬', zone: 'sea-level', description: 'Playful swimmers' },
                
                // Mid-altitude
                { name: 'Zebra', emoji: '🦓', zone: 'mid-altitude', description: 'Striped grazers' },
                { name: 'Antelope', emoji: '🦌', zone: 'mid-altitude', description: 'Savanna sprinters' },
                { name: 'Ostrich', emoji: '🐦', zone: 'mid-altitude', description: 'Flightless runners' },
                
                // High altitude
                { name: 'Mountain Eagle', emoji: '🦅', zone: 'high-altitude', description: 'Highland hunters' },
                { name: 'Mountain Goat', emoji: '🐐', zone: 'high-altitude', description: 'Peak climbers' },
                { name: 'Alpine Hare', emoji: '🐰', zone: 'high-altitude', description: 'Cold-adapted hoppers' }
            ],
            zones: [
                { id: 'sea-level', label: 'Sea Level Coast', elevation: '0 - 500m', emoji: '🌊', color: '#00897b' },
                { id: 'mid-altitude', label: 'Mid-Altitude Savanna', elevation: '1,000m', emoji: '🌾', color: '#f57c00' },
                { id: 'high-altitude', label: 'Highland Mountains', elevation: '2,000m+', emoji: '❄️', color: '#7b1fa2' }
            ]
        };

        let placed = {};
        let score = 0;
        let correct = 0;

        function initGame() {
            placed = {};
            score = 0;
            correct = 0;
            renderGame();
        }

        function renderGame() {
            renderZones();
            renderAnimalsPool();
            updateProgress();
        }

        function renderZones() {
            const container = document.getElementById('zonesContainer');
            container.innerHTML = '';

            gameData.zones.forEach(zone => {
                const zoneEl = document.createElement('div');
                zoneEl.className = `zone ${zone.id}`;
                zoneEl.innerHTML = `
                    <div class="zone-label">${zone.emoji} ${zone.label}</div>
                    <div class="zone-elevation">${zone.elevation}</div>
                    <div class="zone-drop-area" id="zone-${zone.id}" ondrop="dropAnimal(event)" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                    </div>
                `;
                container.appendChild(zoneEl);
            });

            // Re-render placed animals
            Object.keys(placed).forEach(animalName => {
                const zoneId = placed[animalName];
                const animal = gameData.animals.find(a => a.name === animalName);
                const zoneArea = document.getElementById(`zone-${zoneId}`);
                
                const animalEl = document.createElement('div');
                animalEl.className = 'animal';
                animalEl.innerHTML = `<span>${animal.emoji}</span>`;
                animalEl.draggable = true;
                animalEl.ondragstart = (e) => dragStart(e, animalName);
                animalEl.ondragend = dragEnd;
                zoneArea.appendChild(animalEl);
            });
        }

        function renderAnimalsPool() {
            const pool = document.getElementById('animalsPool');
            pool.innerHTML = '';

            gameData.animals.forEach(animal => {
                if (!placed[animal.name]) {
                    const animalEl = document.createElement('div');
                    animalEl.className = 'animal';
                    animalEl.draggable = true;
                    animalEl.innerHTML = `
                        <span>${animal.emoji}</span>
                        <span class="animal-label">${animal.name}</span>
                    `;
                    animalEl.ondragstart = (e) => dragStart(e, animal.name);
                    animalEl.ondragend = dragEnd;
                    pool.appendChild(animalEl);
                }
            });
        }

        function dragStart(e, animalName) {
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('animalName', animalName);
            e.target.classList.add('dragging');
        }

        function dragEnd(e) {
            e.target.classList.remove('dragging');
            document.querySelectorAll('.zone-drop-area').forEach(zone => {
                zone.classList.remove('dragover');
            });
        }

        function allowDrop(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'move';
            e.currentTarget.classList.add('dragover');
        }

        function dragLeave(e) {
            e.currentTarget.classList.remove('dragover');
        }

        function dropAnimal(e) {
            e.preventDefault();
            const animalName = e.dataTransfer.getData('animalName');
            const zoneId = e.currentTarget.id.replace('zone-', '');
            
            placed[animalName] = zoneId;
            renderGame();
        }

        function checkAnswers() {
            let newCorrect = 0;

            gameData.animals.forEach(animal => {
                if (placed[animal.name] === animal.zone) {
                    newCorrect++;
                }
            });

            correct = newCorrect;
            score = newCorrect * 11; // 11 points per correct match

            document.getElementById('scoreDisplay').textContent = score;
            document.getElementById('correctDisplay').textContent = `${correct} / 9`;
            document.getElementById('statusDisplay').textContent = correct === 9 ? '✅' : '❌';

            const feedback = document.getElementById('feedback');
            feedback.classList.add('show');

            if (correct === 9) {
                feedback.classList.add('correct');
                feedback.classList.remove('incorrect');
                feedback.innerHTML = `<p>🎉 Perfect! All animals matched correctly!</p><p>You understand Eritrea's elevation zones!</p>`;
                
                setTimeout(() => {
                    endGame();
                }, 2000);
            } else {
                feedback.classList.add('incorrect');
                feedback.classList.remove('correct');
                feedback.innerHTML = `<p>You got ${correct} / 9 correct! Review the ones that don't match and try again.</p>`;
            }

            updateProgress();
        }

        function endGame() {
            document.getElementById('gameSection').classList.remove('active');
            document.getElementById('summarySection').classList.add('active');

            const summary = document.getElementById('summaryText');
            summary.innerHTML = `
                <p style="font-size: 28px; color: #8b4513; margin-bottom: 10px;">${score} points!</p>
                <p>You mastered Eritrea's elevation zones! You learned how altitude shapes wildlife distribution and survival strategies.</p>
                <div class="stats">
                    <div class="stat-line"><span class="stat-label">Correct Matches:</span> <span class="stat-value">${correct} / 9</span></div>
                    <div class="stat-line"><span class="stat-label">Score:</span> <span class="stat-value">${score}</span></div>
                </div>
            `;

            document.getElementById('funFact').innerHTML = `
                <strong>Did you know?</strong> Eritrea's elevation zones create natural habitat corridors. Some birds migrate through all three zones seasonally, traveling from coast to highlands twice yearly as temperatures change!
            `;
        }

        function resetGame() {
            placed = {};
            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('scoreDisplay').textContent = '0';
            document.getElementById('correctDisplay').textContent = '0 / 9';
            document.getElementById('statusDisplay').textContent = '🎮';
            renderGame();
        }

        function updateProgress() {
            const progress = (Object.keys(placed).length / 9) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        // Initialize
        initGame();
    </script>
</body>
</html>
