<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faroe Islands Seabirds Mystery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a3a52 0%, #2d5a7b 50%, #1a3a52 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            color: #1a3a52;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .score-info {
            display: flex;
            justify-content: space-around;
            background: #f0f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .score-item {
            text-align: center;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #1a3a52;
        }

        .game-section {
            display: none;
        }

        .game-section.active {
            display: block;
        }

        .bird-card {
            background: linear-gradient(135deg, #e3f2fd 0%, #f1f8f6 100%);
            border: 2px solid #1a3a52;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .bird-emoji {
            font-size: 80px;
            text-align: center;
            margin-bottom: 20px;
        }

        .clue-number {
            font-size: 12px;
            color: #666;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .clue-text {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
            padding: 12px;
            background: white;
            border-left: 4px solid #2196f3;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }

        .clue-text.active {
            display: block;
        }

        .hint-button {
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-right: 10px;
            margin-bottom: 15px;
            transition: background 0.3s;
        }

        .hint-button:hover:not(:disabled) {
            background: #f57c00;
        }

        .hint-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .guess-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .guess-section p {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }

        .guess-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .guess-btn {
            padding: 12px;
            border: 2px solid #1a3a52;
            background: white;
            color: #1a3a52;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 14px;
        }

        .guess-btn:hover {
            background: #1a3a52;
            color: white;
            transform: translateY(-2px);
        }

        .guess-btn.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
            animation: pulse 0.5s;
        }

        .guess-btn.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #c8e6c9;
            color: #2e7d32;
            border: 2px solid #4caf50;
        }

        .feedback.incorrect {
            background: #ffcdd2;
            color: #c62828;
            border: 2px solid #f44336;
        }

        .summary-section {
            text-align: center;
        }

        .summary-section h2 {
            font-size: 24px;
            color: #1a3a52;
            margin-bottom: 15px;
        }

        .summary-section p {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .restart-btn {
            background: #1a3a52;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .restart-btn:hover {
            background: #0f2438;
        }

        .fun-fact {
            background: #fff9e6;
            border-left: 4px solid #ff9800;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #2196f3;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐦 Faroe Islands Seabirds 🏔️</h1>
            <p class="subtitle">Which seabird are you spotting on the cliffs?</p>
        </header>

        <div class="score-info">
            <div class="score-item">
                <div>Score</div>
                <div class="score-value" id="scoreDisplay">0</div>
            </div>
            <div class="score-item">
                <div>Bird</div>
                <div class="score-value" id="birdDisplay">1 / 5</div>
            </div>
            <div class="score-item">
                <div>Status</div>
                <div class="score-value" id="statusDisplay">🎮</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>

        <!-- Game Section -->
        <div class="game-section active" id="gameSection">
            <div class="bird-card">
                <div class="bird-emoji" id="birdEmoji">🐦</div>
                <div id="cluesContainer"></div>
                <button class="hint-button" id="hintBtn" onclick="showHint()">Show Next Hint</button>
                <button class="hint-button" id="giveUpBtn" onclick="giveUp()" style="background: #2196f3;">Give Up</button>
                <div class="guess-section">
                    <p>Which bird is this?</p>
                    <div class="guess-buttons" id="guessButtons"></div>
                </div>
                <div class="feedback" id="feedback"></div>
            </div>
        </div>

        <!-- Summary Section -->
        <div class="game-section" id="summarySection">
            <div class="summary-section">
                <h2>Game Complete! 🎉</h2>
                <p id="summaryText"></p>
                <button class="restart-btn" onclick="resetGame()">Play Again</button>
                <div class="fun-fact" id="funFact"></div>
            </div>
        </div>
    </div>

    <script>
        const birds = [
            {
                name: "Puffin",
                emoji: "🐧",
                clues: [
                    "My beak is like a bright orange triangle in summer!",
                    "I dig burrows in the grass like a rabbit, but I live by the sea",
                    "I look like I'm wearing a black and white tuxedo",
                    "I can fit 10+ small fish in my beak at once!"
                ],
                funFact: "Puffins are adorable cliff dwellers that can carry multiple fish in their beaks!",
                options: ["Puffin", "Gannet", "Fulmar", "Kittiwake"]
            },
            {
                name: "Gannet",
                emoji: "⚪",
                clues: [
                    "I'm huge and white with black wingtips, like airplane wings",
                    "I dive into the ocean from 100 feet up - like a feathered missile!",
                    "My head glows golden-yellow like I'm wearing a crown",
                    "My colonies are SO noisy you can hear us from miles away"
                ],
                funFact: "Gannets dive at speeds over 60 mph with special air sacs to cushion the impact!",
                options: ["Gannet", "Puffin", "Arctic Skua", "Fulmar"]
            },
            {
                name: "Fulmar",
                emoji: "🌊",
                clues: [
                    "I have special tube-shaped nostrils on my beak",
                    "I can fly in the worst storms without getting tired",
                    "If you get too close, I'll spit smelly oil at you!",
                    "I'm grey and white, and I glide more than I flap"
                ],
                funFact: "Fulmars have been around since the age of dinosaurs and can live 50+ years!",
                options: ["Fulmar", "Kittiwake", "Puffin", "Arctic Skua"]
            },
            {
                name: "Kittiwake",
                emoji: "🕊️",
                clues: [
                    "I literally say my own name: 'kit-ti-wake, kit-ti-wake!'",
                    "I'm a small, delicate white seagull with neat black wingtips",
                    "I build my nest on the tiniest cliff ledges that seem impossible",
                    "I'm much gentler than my bigger seagull cousins"
                ],
                funFact: "Kittiwakes got their name from their distinctive call that sounds like their name!",
                options: ["Kittiwake", "Gannet", "Arctic Skua", "Puffin"]
            },
            {
                name: "Arctic Skua",
                emoji: "🏴‍☠️",
                clues: [
                    "I'm the pirate of the sky - I steal other birds' fish!",
                    "I chase puffins and gulls until they drop their food",
                    "I'm dark brown with pointed, falcon-like wings",
                    "I'm super fast and can outfly almost any seabird"
                ],
                funFact: "Arctic Skuas are ocean pirates that migrate 44,000 miles annually!",
                options: ["Arctic Skua", "Fulmar", "Kittiwake", "Gannet"]
            }
        ];

        let currentBirdIndex = 0;
        let currentClueIndex = 0;
        let score = 0;
        let guessed = false;

        function initGame() {
            currentBirdIndex = 0;
            currentClueIndex = 0;
            score = 0;
            guessed = false;
            loadBird();
        }

        function loadBird() {
            guessed = false;
            currentClueIndex = 0;
            const bird = birds[currentBirdIndex];
            
            // Keep bird emoji for visual variety (learning the birds)
            document.getElementById('birdEmoji').textContent = '🏔️';
            document.getElementById('birdDisplay').textContent = `${currentBirdIndex + 1} / 5`;
            document.getElementById('statusDisplay').textContent = '🎮';
            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('hintBtn').disabled = false;
            document.getElementById('hintBtn').textContent = 'Show Next Hint';
            
            renderClues();
            renderGuessButtons();
            updateProgressBar();
        }

        function renderClues() {
            const bird = birds[currentBirdIndex];
            const cluesContainer = document.getElementById('cluesContainer');
            cluesContainer.innerHTML = '';
            
            bird.clues.forEach((clue, index) => {
                const clueDiv = document.createElement('div');
                clueDiv.className = `clue-text ${index === currentClueIndex ? 'active' : ''}`;
                clueDiv.textContent = clue;
                cluesContainer.appendChild(clueDiv);
            });
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function renderGuessButtons() {
            const bird = birds[currentBirdIndex];
            const guessButtons = document.getElementById('guessButtons');
            guessButtons.innerHTML = '';
            
            const options = shuffleArray(bird.options);
            
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'guess-btn';
                btn.textContent = option;
                btn.onclick = () => makeGuess(option);
                btn.disabled = guessed;
                guessButtons.appendChild(btn);
            });
        }

        function showHint() {
            const bird = birds[currentBirdIndex];
            if (currentClueIndex < bird.clues.length - 1) {
                currentClueIndex++;
                renderClues();
                
                if (currentClueIndex === bird.clues.length - 1) {
                    document.getElementById('hintBtn').textContent = 'Last Hint!';
                    document.getElementById('hintBtn').disabled = true;
                }
            }
        }

        function giveUp() {
            const bird = birds[currentBirdIndex];
            showFeedback(false, `It was a ${bird.name}!`, bird);
        }

        function makeGuess(guess) {
            const bird = birds[currentBirdIndex];
            const isCorrect = guess === bird.name;
            
            if (isCorrect) {
                const pointsGained = Math.max(10 - currentClueIndex * 2, 1);
                score += pointsGained;
                document.getElementById('scoreDisplay').textContent = score;
            }
            
            showFeedback(isCorrect, guess, bird);
        }

        function showFeedback(isCorrect, guess, bird) {
            guessed = true;
            const feedback = document.getElementById('feedback');
            const guessButtons = document.querySelectorAll('.guess-btn');
            
            guessButtons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === bird.name) {
                    btn.classList.add('correct');
                } else if (btn.textContent === guess && !isCorrect) {
                    btn.classList.add('incorrect');
                }
            });
            
            document.getElementById('hintBtn').disabled = true;
            document.getElementById('giveUpBtn').disabled = true;
            
            if (isCorrect) {
                const hintsUsed = currentClueIndex;
                feedback.className = 'feedback show correct';
                feedback.innerHTML = `<p>✅ Correct! That's a ${bird.name}!</p><p>You got it in ${hintsUsed} hint${hintsUsed !== 1 ? 's' : ''}!</p>`;
                document.getElementById('statusDisplay').textContent = '✅';
            } else {
                feedback.className = 'feedback show incorrect';
                feedback.innerHTML = `<p>❌ Not quite! It was a ${bird.name}.</p>`;
                document.getElementById('statusDisplay').textContent = '❌';
            }
            
            setTimeout(() => {
                if (currentBirdIndex < birds.length - 1) {
                    currentBirdIndex++;
                    loadBird();
                } else {
                    endGame();
                }
            }, 2500);
        }

        function endGame() {
            document.getElementById('gameSection').classList.remove('active');
            document.getElementById('summarySection').classList.add('active');
            
            const summary = document.getElementById('summaryText');
            summary.innerHTML = `<p style="font-size: 28px; color: #1a3a52; margin-bottom: 10px;">${score} points!</p><p>Amazing! You've learned the seabirds of the Faroe Islands!</p>`;
            
            document.getElementById('funFact').innerHTML = `<strong>Did you know?</strong> The Faroe Islands are home to millions of seabirds that nest in impossibly high cliff colonies. Over 80,000 puffin pairs make their burrows here every summer!`;
        }

        function resetGame() {
            currentBirdIndex = 0;
            currentClueIndex = 0;
            score = 0;
            guessed = false;
            document.getElementById('summarySection').classList.remove('active');
            document.getElementById('gameSection').classList.add('active');
            loadBird();
        }

        function updateProgressBar() {
            const progress = (currentBirdIndex / birds.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        // Initialize
        initGame();
    </script>
</body>
</html>
