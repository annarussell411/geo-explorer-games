<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>German Wildlife Comeback Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a472a 0%, #2d5a3d 50%, #1a472a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 700px;
            width: 100%;
            padding: 40px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 28px;
            color: #1a472a;
            margin-bottom: 8px;
        }

        .subtitle {
            font-size: 14px;
            color: #666;
            margin-bottom: 15px;
        }

        .score-info {
            display: flex;
            justify-content: space-around;
            background: #f0f4f8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .score-item {
            text-align: center;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #1a472a;
        }

        .game-section {
            display: none;
        }

        .game-section.active {
            display: block;
        }

        .animal-card {
            background: linear-gradient(135deg, #e8f5e9 0%, #f1f8f6 100%);
            border: 2px solid #2d5a3d;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .animal-emoji {
            font-size: 80px;
            text-align: center;
            margin-bottom: 20px;
        }

        .clue-number {
            font-size: 12px;
            color: #666;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .clue-text {
            font-size: 16px;
            color: #333;
            line-height: 1.5;
            padding: 12px;
            background: white;
            border-left: 4px solid #4caf50;
            border-radius: 4px;
            margin-bottom: 15px;
            display: none;
        }

        .clue-text.active {
            display: block;
        }

        .hint-button {
            background: #ff9800;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            margin-right: 10px;
            margin-bottom: 15px;
            transition: background 0.3s;
        }

        .hint-button:hover:not(:disabled) {
            background: #f57c00;
        }

        .hint-button:disabled {
            background: #ccc;
            cursor: not-allowed;
            opacity: 0.6;
        }

        .guess-section {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
        }

        .guess-section p {
            font-size: 14px;
            color: #666;
            margin-bottom: 12px;
        }

        .guess-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .guess-btn {
            padding: 12px;
            border: 2px solid #2d5a3d;
            background: white;
            color: #2d5a3d;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            font-size: 14px;
        }

        .guess-btn:disabled {
            cursor: not-allowed;
        }

        .guess-btn:hover {
            background: #2d5a3d;
            color: white;
            transform: translateY(-2px);
        }

        .guess-btn.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
            animation: pulse 0.5s;
        }

        .guess-btn.incorrect {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .feedback.show {
            display: block;
        }

        .feedback.correct {
            background: #c8e6c9;
            color: #2e7d32;
            border: 2px solid #4caf50;
        }

        .feedback.incorrect {
            background: #ffcdd2;
            color: #c62828;
            border: 2px solid #f44336;
        }

        .summary-section {
            text-align: center;
        }

        .summary-section h2 {
            font-size: 24px;
            color: #1a472a;
            margin-bottom: 15px;
        }

        .summary-section p {
            font-size: 16px;
            color: #666;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .restart-btn {
            background: #2d5a3d;
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .restart-btn:hover {
            background: #1a472a;
        }

        .fun-fact {
            background: #fff9e6;
            border-left: 4px solid #ff9800;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            font-size: 14px;
            color: #666;
            line-height: 1.5;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #4caf50;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🐺 German Wildlife Comeback 🐺</h1>
            <p class="subtitle">Can you guess these animals returning to German forests?</p>
        </header>

        <div class="score-info">
            <div class="score-item">
                <div>Score</div>
                <div class="score-value" id="scoreDisplay">0</div>
            </div>
            <div class="score-item">
                <div>Animal</div>
                <div class="score-value" id="animalDisplay">1 / 5</div>
            </div>
            <div class="score-item">
                <div>Status</div>
                <div class="score-value" id="statusDisplay">🎮</div>
            </div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill" style="width: 0%;"></div>
        </div>

        <!-- Game Section -->
        <div class="game-section active" id="gameSection">
            <div class="animal-card">
                <div class="animal-emoji" id="animalEmoji">🌲</div>
                <div id="cluesContainer"></div>
                <button class="hint-button" id="hintBtn" onclick="showHint()">Show Next Hint</button>
                <button class="hint-button" id="giveUpBtn" onclick="giveUp()" style="background: #2196f3;">Give Up</button>
                <div class="guess-section">
                    <p>What animal is this?</p>
                    <div class="guess-buttons" id="guessButtons"></div>
                </div>
                <div class="feedback" id="feedback"></div>
            </div>
        </div>

        <!-- Summary Section -->
        <div class="game-section" id="summarySection">
            <div class="summary-section">
                <h2>Game Complete! 🎉</h2>
                <p id="summaryText"></p>
                <button class="restart-btn" onclick="resetGame()">Play Again</button>
                <div class="fun-fact" id="funFact"></div>
            </div>
        </div>
    </div>

    <script>
        const animals = [
            {
                name: "Wolf",
                emoji: "🐺",
                clues: [
                    "I vanished from Germany 150 years ago, hunted to extinction.",
                    "Around 2000, I started sneaking back from Poland, migrating across the border.",
                    "Today, over 1,000 of me now live in German forests, especially the east.",
                    "I hunt deer and wild boar, and I'm making a major comeback! 🐺"
                ],
                funFact: "Wolves walk 20-30 km per day! They migrated all the way from Russia and Eastern Europe back into Germany.",
                options: ["Wolf", "Lynx", "Beaver", "Wild Boar"]
            },
            {
                name: "Lynx",
                emoji: "🐯",
                clues: [
                    "I'm a big spotted cat, once completely gone from Germany.",
                    "I've got tufted ears and a short stubby tail—perfect for sneaking through forests.",
                    "I'm returning slowly from Eastern Europe, hunting deer in the Bavarian Forest.",
                    "I'm super shy and rarely seen, which makes spotting me a major wildlife win! 🐯"
                ],
                funFact: "Lynx have super hearing! They can hear a mouse squeaking from 50 meters away.",
                options: ["Wolf", "Lynx", "Beaver", "Deer"]
            },
            {
                name: "Beaver",
                emoji: "🦫",
                clues: [
                    "I'm an engineer who builds dams and reshapes rivers.",
                    "Once hunted for my fur, I was nearly extinct in Europe.",
                    "Now I'm back, and I'm transforming German waterways and creating wetlands.",
                    "My dams create habitats for fish, birds, and other animals. I'm basically nature's architect! 🦫"
                ],
                funFact: "Beavers can hold their breath for 15 minutes underwater! Their teeth never stop growing.",
                options: ["Beaver", "Wolf", "Otter", "Lynx"]
            },
            {
                name: "Wild Boar",
                emoji: "🐗",
                clues: [
                    "I've lived in German forests for centuries—I never actually left!",
                    "But recently, my population EXPLODED thanks to warm winters and plenty of food.",
                    "I dig up the forest floor looking for acorns, roots, and mushrooms.",
                    "I'm becoming so common that I'm now wandering into cities looking for garbage! 🐗"
                ],
                funFact: "Wild boars are incredibly smart—they've learned to remember where acorns fall each year!",
                options: ["Wild Boar", "Deer", "Wolf", "Beaver"]
            },
            {
                name: "Red Deer",
                emoji: "🦌",
                clues: [
                    "I'm a large hoofed animal with impressive antlers (if I'm male).",
                    "I've always lived in German forests, but my numbers are booming.",
                    "I love acorns and fresh shoots. Wolves are returning, and I'm their favorite meal!",
                    "You'll hear me roaring during rutting season—it's an incredible sound! 🦌"
                ],
                funFact: "Red deer can run up to 40 km/h! Male antlers can weigh up to 12 kg.",
                options: ["Red Deer", "Wild Boar", "Wolf", "Elk"]
            }
        ];

        let currentAnimalIndex = 0;
        let currentClueIndex = 0;
        let score = 0;
        let guessed = false;

        function initGame() {
            currentAnimalIndex = 0;
            currentClueIndex = 0;
            score = 0;
            guessed = false;
            loadAnimal();
        }

        function loadAnimal() {
            guessed = false;
            currentClueIndex = 0;
            const animal = animals[currentAnimalIndex];
            
            // Keep forest emoji - don't reveal the animal
            document.getElementById('animalDisplay').textContent = `${currentAnimalIndex + 1} / 5`;
            document.getElementById('statusDisplay').textContent = '🎮';
            document.getElementById('feedback').classList.remove('show', 'correct', 'incorrect');
            document.getElementById('hintBtn').disabled = false;
            document.getElementById('hintBtn').textContent = 'Show Next Hint';
            
            renderClues();
            renderGuessButtons();
            updateProgressBar();
        }

        function renderClues() {
            const animal = animals[currentAnimalIndex];
            const cluesContainer = document.getElementById('cluesContainer');
            cluesContainer.innerHTML = '';
            
            animal.clues.forEach((clue, index) => {
                const clueDiv = document.createElement('div');
                clueDiv.className = `clue-text ${index === currentClueIndex ? 'active' : ''}`;
                clueDiv.textContent = clue;
                cluesContainer.appendChild(clueDiv);
            });
        }

        function shuffleArray(array) {
            const shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        function renderGuessButtons() {
            const animal = animals[currentAnimalIndex];
            const guessButtons = document.getElementById('guessButtons');
            guessButtons.innerHTML = '';
            
            // Properly shuffle options using Fisher-Yates
            const options = shuffleArray(animal.options);
            
            options.forEach(option => {
                const btn = document.createElement('button');
                btn.className = 'guess-btn';
                btn.textContent = option;
                btn.onclick = () => makeGuess(option);
                btn.disabled = guessed;
                guessButtons.appendChild(btn);
            });
        }

        function showHint() {
            const animal = animals[currentAnimalIndex];
            if (currentClueIndex < animal.clues.length - 1) {
                currentClueIndex++;
                renderClues();
                
                if (currentClueIndex === animal.clues.length - 1) {
                    document.getElementById('hintBtn').textContent = 'Last Hint!';
                    document.getElementById('hintBtn').disabled = true;
                }
            }
        }

        function giveUp() {
            const animal = animals[currentAnimalIndex];
            showFeedback(false, `It was a ${animal.name}!`, animal);
        }

        function makeGuess(guess) {
            const animal = animals[currentAnimalIndex];
            const isCorrect = guess === animal.name;
            
            if (isCorrect) {
                const pointsGained = Math.max(10 - currentClueIndex * 2, 1);
                score += pointsGained;
                document.getElementById('scoreDisplay').textContent = score;
            }
            
            showFeedback(isCorrect, guess, animal);
        }

        function showFeedback(isCorrect, guess, animal) {
            guessed = true;
            const feedback = document.getElementById('feedback');
            const guessButtons = document.querySelectorAll('.guess-btn');
            
            guessButtons.forEach(btn => {
                btn.disabled = true;
                if (btn.textContent === animal.name) {
                    btn.classList.add('correct');
                } else if (btn.textContent === guess && !isCorrect) {
                    btn.classList.add('incorrect');
                }
            });
            
            document.getElementById('hintBtn').disabled = true;
            document.getElementById('giveUpBtn').disabled = true;
            
            if (isCorrect) {
                const hintsUsed = currentClueIndex;
                feedback.className = 'feedback show correct';
                feedback.innerHTML = `<p>✅ Correct! That's a ${animal.name}!</p><p>You got it in ${hintsUsed} hint${hintsUsed !== 1 ? 's' : ''}!</p>`;
                document.getElementById('statusDisplay').textContent = '✅';
            } else {
                feedback.className = 'feedback show incorrect';
                feedback.innerHTML = `<p>❌ Not quite! It was a ${animal.name}.</p>`;
                document.getElementById('statusDisplay').textContent = '❌';
            }
            
            setTimeout(() => {
                if (currentAnimalIndex < animals.length - 1) {
                    currentAnimalIndex++;
                    loadAnimal();
                } else {
                    endGame();
                }
            }, 2500);
        }

        function endGame() {
            document.getElementById('gameSection').classList.remove('active');
            document.getElementById('summarySection').classList.add('active');
            
            const summary = document.getElementById('summaryText');
            summary.innerHTML = `<p style="font-size: 28px; color: #4caf50; margin-bottom: 10px;">${score} points!</p><p>Great job discovering German wildlife! You've learned about amazing animals making their comeback.</p>`;
            
            document.getElementById('funFact').innerHTML = `<strong>Did you know?</strong> Germany shares borders with 9 countries, making it a natural wildlife corridor for animals migrating back into Western Europe!`;
        }

        function resetGame() {
            document.getElementById('summarySection').classList.remove('active');
            document.getElementById('gameSection').classList.add('active');
            initGame();
        }

        function updateProgressBar() {
            const progress = (currentAnimalIndex / animals.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        // Initialize
        initGame();
    </script>
</body>
</html>
